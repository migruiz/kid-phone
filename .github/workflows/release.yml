# Builds both apps from a version tag and publishes them as a GitHub release. The apps check
# github.com/migruiz/kid-phone/releases/latest and update themselves from it.
#
# To release: set appVersionName in gradle.properties (e.g. 1.2.0), commit, then
#   git tag v1.2.0 && git push origin main v1.2.0
name: Release

on:
  push:
    tags: ['v*']
  # A test build without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches gradle.properties
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="$(grep '^appVersionName=' gradle.properties | cut -d= -f2)"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but gradle.properties says $want"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Hub tests
        run: cd hub && node --test

      # The apps are signed with the key Kid Phone was first installed with; Android only accepts
      # updates signed with the same key.
      - name: Signing key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          echo "keystore: $(wc -c < ~/.android/debug.keystore) bytes, sha256 $(sha256sum ~/.android/debug.keystore | cut -c1-16)"

      - name: Firebase config for the parent app
        run: echo "${{ secrets.PARENT_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > parent/google-services.json

      - name: Build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :parent:assembleRelease --no-daemon

      - name: Check the signature
        run: |
          signer="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in app/build/outputs/apk/release/app-release.apk parent/build/outputs/apk/release/parent-release.apk; do
            "$signer" verify --print-certs "$apk" | grep -i "sha-256" || true
            "$signer" verify --print-certs "$apk" | grep -q "SHA-256 digest: 30a1b1b139275b396a280343bdeaaaa884eef3c725ca05933097e1a4ea2a8705" \
              || { echo "$apk is not signed with the Kid Phone key"; exit 1; }
          done

      - name: Name the files
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/kid-phone.apk
          cp parent/build/outputs/apk/release/parent-release.apk out/kid-phone-parent.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*.apk
          generate_release_notes: true
